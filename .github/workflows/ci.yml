name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - run: bun run gen:skills
      - run: git diff --exit-code -- skills skills-codex
      - run: bun run check
      - run: bun run lint
      - run: bun run build
      - run: bun run test
        env:
          MSTACK_TEST_MOB_BIN: apps/cli/dist/mob
      - run: bun run deadcode
