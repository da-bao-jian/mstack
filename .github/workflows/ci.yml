name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - run: bun run gen:skills
      - run: git diff --exit-code -- skills skills-codex
      - run: bun run check
      - run: bun run lint
      - run: bun run build
      - run: bun run test
        env:
          MSTACK_TEST_MOB_BIN: apps/cli/dist/mob
      - run: bun run deadcode
