name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    # A stalled Bun process fails the job instead of holding the runner for hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - run: bun run gen:skills
      - run: git diff --exit-code -- skills skills-codex
      - run: bun run check
      - run: bun run lint
      # Test the compiled CLI, as CI does, so each preamble spawn starts warm.
      - run: bun run build
      - run: bun run test --timeout 30000
        env:
          MSTACK_TEST_MOB_BIN: apps/cli/dist/mob
      - run: bun run deadcode
      - name: Prepare release notes and version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version=${RELEASE_TAG#v}
          test "$RELEASE_TAG" = "v$(bun -p 'require("./package.json").version')"
          test "$version" = "$(bun -p 'require("./.claude-plugin/plugin.json").version')"
          mkdir -p dist/release
          bun scripts/release.ts --notes "$version" > dist/release-notes.md
          printf '%s\n' "$version" > dist/release/VERSION
      - name: Cross-compile all five targets
        run: |
          set -eu
          for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            asset="mob-$platform"
            if [ "$platform" = windows-x64 ]; then asset="$asset.exe"; fi
            bun build --compile --target="bun-$platform" apps/cli/src/main.ts packages/signers/src/walletconnect-worker.ts --entry-naming '[name].[ext]' --outfile "dist/release/$asset"
          done
          cd dist/release
          sha256sum mob-* VERSION > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Smoke Linux binary
        run: |
          test "$(dist/release/mob-linux-x64 --version)" = "$(cat dist/release/VERSION)"
          dist/release/mob-linux-x64 explain funding --simple
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/release/* --verify-tag --title "$RELEASE_TAG" --notes-file dist/release-notes.md
